name: One-time secure dependency refresh

on:
  push:
    branches: [refactor/consolidation-safe-2026-09-09]

permissions:
  contents: write

concurrency:
  group: one-time-secure-dependency-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Refresh patched dependency tree
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.3 eslint-config-next@16.3.3 sharp@0.35.4

      - name: Validate lockfile installation
        run: npm ci --ignore-scripts

      - name: Verify critical dependency gate
        run: |
          npm audit --omit=dev --audit-level=critical
          npm audit --audit-level=critical
          node -e "const p=require('./package-lock.json'); const next=p.packages?.['node_modules/next']?.version; const sharp=p.packages?.['node_modules/sharp']?.version; if(next!=='16.3.3') throw new Error('Expected Next.js 16.3.3, found '+next); if(sharp!=='0.35.4') throw new Error('Expected sharp 0.35.4, found '+sharp); console.log({next, sharp});"

      - name: Commit dependency refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "fix: patch critical Next.js dependency chain"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/one-time-secure-dependency-refresh.yml
          git add .github/workflows/one-time-secure-dependency-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove one-time dependency refresh workflow"
          git push
